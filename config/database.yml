default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USER", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>


development:
  <<: *default
  database: festival_development







test:
  <<: *default
  database: festival_test

production:
  <<: *default
  database: festival_production
  username: festival
  password: <%= ENV["FESTIVAL_DATABASE_PASSWORD"] %>
